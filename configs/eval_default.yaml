# Default evaluation configuration for AscendKernelBench.
hardware: ascend910b2

# Correctness protocol (docs/guide/evaluation.md)
num_correct_trials: 5
seed: 42
tolerances:
  fp32: {atol: 1.0e-4, rtol: 1.0e-4}
  fp16: {atol: 1.0e-2, rtol: 1.0e-2}
  bf16: {atol: 1.0e-2, rtol: 1.0e-2}
precision: fp32

# Performance protocol (docs/guide/evaluation.md)
num_perf_trials: 100
# 10 warmups follow SOL-ExecBench isolation practice; 100 retained trials
# keep KernelBench-style timing statistics.
num_warmup: 10
# Speedup above this threshold is flagged for manual review: excluded from
# the p > 0 fast_p thresholds and the geometric mean, but still counted in
# fast_0 (the correctness rate). See docs/guide/results.md.
excessive_speedup: 10.0

# Timeouts (seconds). The build stage runs configure AND build, each allowed
# build_timeout; the host-side worker budget is eval_timeout + 2*build_timeout.
build_timeout: 600
eval_timeout: 300

# Operator compilation mode. `aclnn` builds a process-local libcustom_op.so
# and loads it in the evaluating PyTorch process (never installed globally).
# `jit` is reserved and not implemented yet.
operator_mode: aclnn

# Generation defaults
generation:
  model: deepseek-v4-flash
  temperature: 0.0
  max_tokens: 16384
  num_samples: 1
  prompt_mode: one_shot   # zero_shot | one_shot | few_shot
