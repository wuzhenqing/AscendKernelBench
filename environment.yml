# Experiment environment for AscendKernelBench on a Linux Ascend host.
# CANN is not installed by conda; source the toolkit after activate:
#   source /usr/local/Ascend/cann-9.1.0/set_env.sh
#
# Create:
#   conda env create -f environment.yml
#   conda activate akb
#   python -m pip install -e ".[dev]"
#
# Official pairing for CANN 9.1.0 is PyTorch 2.10.0 + torch-npu 2.10.x.
# This file pins the latest 2.10 patch published for that line.
name: akb
channels:
  - defaults
dependencies:
  - python=3.12
  - pip
  - pip:
      - torch==2.10.0
      - torch-npu==2.10.0.post6
      - pyyaml
      - setuptools
