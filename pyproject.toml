[build-system]
requires = ["setuptools>=80"]
build-backend = "setuptools.build_meta"

[project]
name = "ascend-kernel-bench"
version = "0.1.0"
description = "Standardized benchmark for LLM-generated Ascend C operators on Huawei Ascend NPU"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "openai",
    "pydantic",
    "rich",
    "pyyaml",
    "numpy",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "ruff>=0.13",
    "pre-commit>=4",
]
npu = [
    "torch==2.10.0",
    "torch-npu==2.10.0.post6",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.setuptools.package-data]
# Examples live one level down (prompts/examples/<name>/<files>); the second
# glob is what actually ships their contents.
ascend_kernel_bench = ["prompts/examples/*", "prompts/examples/*/*", "py.typed"]

[tool.ruff]
line-length = 80
target-version = "py310"
extend-exclude = [
    "KernelBench",
    "docs/.vitepress",
    "runs",
    "results",
]

[tool.ruff.lint]
select = [
    "E",
    "F",
    "W",
    "I",
    "UP",
    "B",
    "SIM",
    "N",
    "D",
    "C4",
    "PIE",
    "RUF",
]
ignore = [
    "D203",
    "D213",
]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["D"]
"scripts/**" = ["D100"]
"scripts/_bootstrap.py" = ["D"]
# Few-shot assets must keep the KernelBench task contract (Model, A, B).
"src/ascend_kernel_bench/prompts/examples/**" = ["D", "N"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "lf"
docstring-code-format = true

[tool.codespell]
skip = "KernelBench,docs/.vitepress,package-lock.json,*.asc,*.so"
ignore-words-list = "cann,npu,arange,compilability"
