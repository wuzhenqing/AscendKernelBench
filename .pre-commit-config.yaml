# Local style gate for AscendKernelBench.
# Install once:  python -m pip install -e ".[dev]" && pre-commit install
# Run on demand: pre-commit run --all-files
#
# Ruff enforces PEP 8 (E/W) plus selected pyflakes/bugbear rules and
# Google-convention pydocstyle (D). ruff-format keeps the 80-column
# Google / PEP 8 wrap. Vendored KernelBench tasks are never rewritten.

default_language_version:
  python: python3

exclude: ^(KernelBench/|runs/|results/)

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
        exclude_types: [markdown]
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-toml
      - id: check-json
      - id: check-added-large-files
        args: [--maxkb=1024]
      - id: check-merge-conflict
      - id: check-ast
      - id: debug-statements
      - id: mixed-line-ending
        args: [--fix=lf]

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.13.0
    hooks:
      - id: ruff
        args: [--fix, --exit-non-zero-on-fix]
      - id: ruff-format

  - repo: https://github.com/codespell-project/codespell
    rev: v2.4.1
    hooks:
      - id: codespell
        additional_dependencies: [tomli]
        args: [--toml=pyproject.toml]
