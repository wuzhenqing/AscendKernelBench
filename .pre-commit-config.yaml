# Optional local checks. Install deps with pip install -r requirements.txt.

default_language_version:
  python: python3

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
        exclude_types: [markdown]
      - id: end-of-file-fixer
      - id: check-yaml

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.13.0
    hooks:
      - id: ruff
        files: ^(src/|scripts/)
        args: [--fix, --exit-non-zero-on-fix, "--select=E,F,W,I"]
      - id: ruff-format
        files: ^(src/|scripts/)
